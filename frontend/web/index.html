<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="frontend">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>frontend</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Web push token for PushService (lib/services/push_web.dart). The Firebase
    // config comes from the backend (/api/push/config), so nothing is in git,
    // and the SDK loads only when push is set up.
    window.bcPushGetToken = async (configJson) => {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return null;
      if (Notification.permission === 'default') await Notification.requestPermission();
      if (Notification.permission !== 'granted') return null;
      const { vapidKey, ...config } = JSON.parse(configJson);
      const sdk = 'https://www.gstatic.com/firebasejs/13.2.0/';
      const { initializeApp, getApps } = await import(sdk + 'firebase-app.js');
      const { getMessaging, getToken } = await import(sdk + 'firebase-messaging.js');
      const reg = await navigator.serviceWorker.register('push_sw.js', { scope: './push/' });
      const worker = reg.installing || reg.waiting;
      if (!reg.active && worker) {
        await new Promise((done) => worker.addEventListener('statechange',
          () => worker.state === 'activated' && done()));
      }
      const app = getApps()[0] || initializeApp(config);
      return getToken(getMessaging(app), { vapidKey, serviceWorkerRegistration: reg });
    };
    window.bcPushListenOpens = (onOpen) => {
      window._bcPushOnOpen = onOpen;
      if (!window._bcPushSwBound && 'serviceWorker' in navigator) {
        window._bcPushSwBound = true;
        navigator.serviceWorker.addEventListener('message', (event) => {
          const d = event.data;
          if (
            d &&
            d.type === 'openConversation' &&
            typeof d.conversation === 'string' &&
            d.conversation &&
            typeof window._bcPushOnOpen === 'function'
          ) {
            window._bcPushOnOpen(d.conversation);
          }
        });
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
