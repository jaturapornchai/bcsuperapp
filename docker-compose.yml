services:
  bcapp-mongodb:
    image: mongo:7.0
    container_name: bcapp-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27029:27017"
    volumes:
      - bcapp_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  bcapp-minio:
    image: minio/minio:latest
    container_name: bcapp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9120:9000"
      - "127.0.0.1:9121:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bcappadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bcapp_minio_local_dev}
    volumes:
      - bcapp_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bcapp_mongo_data:
  bcapp_minio_data:
